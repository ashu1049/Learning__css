<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media query</title>
</head>
<style>
    @media screen and (min-width: 320px) and (max-width: 767px)
    {
        body{
            font-size:20px;
            background-color: red;
        }
        
    }

     @media screen and (min-width:768px) and (max-width: 1023px)
    {
        body{
            font-size:20px;
            background-color: purple;
            color: orange;
        }
        
    }

     @media screen and (min-width: 1024px) 
    {
        body{
            font-size:20px;
            background-color: black;
            color: white;
        }
        
    }


</style>
<body>
    <h1>This is h1 tag.</h1><br>

    <h2>This is h1 tag.</h2><br>

    <h3>This is h1 tag.</h3><br>

    <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloremque hic eaque molestias earum veniam? Error beatae, commodi mollitia facilis maxime, ipsam veniam, assumenda libero iusto laudantium exercitationem alias ea dolores.</p>
</body>
</html>
